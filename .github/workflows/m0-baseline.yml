name: M0 Baseline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            AGENTS.md
            .gitignore
            THIRD_PARTY_LICENSES.md
            scripts/check_environment.sh
            docs/planning/AI机器人开发项目计划_v1.4.md
            docs/planning/ROS2机器人开发规划_v1.0.md
            docs/planning/AI_Agent开发规划_v1.0.md
          )
          for file in "${required_files[@]}"; do
            test -f "$file"
          done

      - name: Check environment script syntax
        shell: bash
        run: |
          bash -n \
            scripts/check_environment.sh \
            scripts/install_dependencies.sh \
            scripts/build.sh \
            scripts/test.sh \
            scripts/check_nodes.sh

      - name: Reject tracked build outputs and local secrets
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(build|install|log|secrets)/|(^|/)\.env($|\.)|\.pem$|\.p12$'
          if git ls-files | grep -E "$forbidden_pattern"; then
            echo "Tracked build output or sensitive local file detected."
            exit 1
          fi

  ros2-build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install package dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths src --ignore-src --rosdistro humble -y

      - name: Build
        shell: bash
        run: bash scripts/build.sh

      - name: Test
        shell: bash
        run: bash scripts/test.sh

      - name: Verify minimum nodes
        shell: bash
        run: bash scripts/check_nodes.sh
