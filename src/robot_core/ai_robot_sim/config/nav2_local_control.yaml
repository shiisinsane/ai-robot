robot/behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: /robot/local_costmap/costmap_raw
    global_costmap_topic: /robot/global_costmap/costmap_raw
    local_footprint_topic: /robot/local_costmap/published_footprint
    global_footprint_topic: /robot/global_costmap/published_footprint
    cycle_frequency: 10.0
    transform_tolerance: 0.3
    global_frame: odom
    robot_base_frame: base_link
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.6
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors/Spin
    wait:
      plugin: nav2_behaviors/Wait
