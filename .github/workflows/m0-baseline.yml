name: M0 工程基线

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-22.04
    outputs:
      needs_ros: ${{ steps.detect-changes.outputs.needs_ros }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断是否需要 ROS 2 检查
        id: detect-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "合并后的 main 只运行仓库基线检查。"
            echo "needs_ros=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '本次 Pull Request 的变更文件：\n%s\n' "$changed_files"

          ros_pattern='^(src|tests|config|test_data|scripts)/|^\.github/workflows/|(^|/)(package\.xml|CMakeLists\.txt|setup\.py|setup\.cfg|pyproject\.toml|requirements[^/]*\.txt)$'
          if printf '%s\n' "$changed_files" | grep -Eq "$ros_pattern"; then
            echo "检测到影响 ROS 2 的变更，将运行完整检查。"
            echo "needs_ros=true" >> "$GITHUB_OUTPUT"
          else
            echo "仅包含文档或非运行时变更，跳过完整 ROS 2 检查。"
            echo "needs_ros=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证必需文件
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            AGENTS.md
            .gitignore
            THIRD_PARTY_LICENSES.md
            scripts/check_environment.sh
            docs/planning/AI机器人开发项目计划_v1.5.md
            docs/planning/ROS2机器人开发规划_v1.1.md
            docs/planning/AI_Agent开发规划_v1.1.md
          )
          for file in "${required_files[@]}"; do
            test -f "$file"
          done

      - name: 检查环境脚本语法
        shell: bash
        run: |
          bash -n \
            scripts/check_environment.sh \
            scripts/install_dependencies.sh \
            scripts/build.sh \
            scripts/test.sh \
            scripts/check_nodes.sh

      - name: 拒绝构建产物和本地密钥
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(build|install|log|secrets)/|(^|/)\.env($|\.)|\.pem$|\.p12$'
          if git ls-files | grep -E "$forbidden_pattern"; then
            echo "检测到被跟踪的构建产物或敏感本地文件。"
            exit 1
          fi

  ros2-build-and-test:
    needs: repository-baseline
    if: needs.repository-baseline.outputs.needs_ros == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: 安装软件包依赖
        shell: bash
        run: bash scripts/install_dependencies.sh

      - name: 构建
        shell: bash
        run: bash scripts/build.sh

      - name: 测试
        shell: bash
        run: bash scripts/test.sh

      - name: 验证最小节点
        shell: bash
        run: bash scripts/check_nodes.sh
