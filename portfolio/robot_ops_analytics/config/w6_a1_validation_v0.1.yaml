version: roa-w6-a1-validation-v0.1
status: frozen_before_execution
frozen_at: "2026-08-26"
simulation_only: true
source_dataset_version: roa-data-v0.1
validation_dataset_version: roa-validation-a1-v0.1
candidate_id: A1_return_home_medium_navigation_failure
experiment_purpose: controlled_validation

fixed_conditions:
  route_id: return_home
  start_pose: {x_m: 0.8, y_m: 0.0, yaw_rad: 0.0}
  target_pose: {x_m: 0.0, y_m: 0.0, yaw_rad: 0.0}
  localization_perturbation_level: none
  localization_perturbation: {x_m: 0.0, y_m: 0.0, yaw_rad: 0.0}
  parameter_version: baseline
  navigation_config: src/robot_core/ai_robot_sim/config/nav2_local_control.yaml
  task_timeout_sec: 90
  run_origin: natural

groups:
  control:
    obstacle_profile: low
    obstacle_position: {x_m: 0.4, y_m: 0.9, z_m: 0.45}
    required_valid_tasks: 15
  treatment:
    obstacle_profile: medium
    obstacle_position: {x_m: 0.4, y_m: 0.56, z_m: 0.45}
    required_valid_tasks: 15

assignment:
  method: randomized_order_within_balanced_pairs
  seed: 20260826
  block_count: 15
  tasks_per_block: 2
  sequence:
    - {run_order: 1, block: 1, position: 1, obstacle_profile: low}
    - {run_order: 2, block: 1, position: 2, obstacle_profile: medium}
    - {run_order: 3, block: 2, position: 1, obstacle_profile: medium}
    - {run_order: 4, block: 2, position: 2, obstacle_profile: low}
    - {run_order: 5, block: 3, position: 1, obstacle_profile: medium}
    - {run_order: 6, block: 3, position: 2, obstacle_profile: low}
    - {run_order: 7, block: 4, position: 1, obstacle_profile: low}
    - {run_order: 8, block: 4, position: 2, obstacle_profile: medium}
    - {run_order: 9, block: 5, position: 1, obstacle_profile: medium}
    - {run_order: 10, block: 5, position: 2, obstacle_profile: low}
    - {run_order: 11, block: 6, position: 1, obstacle_profile: medium}
    - {run_order: 12, block: 6, position: 2, obstacle_profile: low}
    - {run_order: 13, block: 7, position: 1, obstacle_profile: medium}
    - {run_order: 14, block: 7, position: 2, obstacle_profile: low}
    - {run_order: 15, block: 8, position: 1, obstacle_profile: medium}
    - {run_order: 16, block: 8, position: 2, obstacle_profile: low}
    - {run_order: 17, block: 9, position: 1, obstacle_profile: low}
    - {run_order: 18, block: 9, position: 2, obstacle_profile: medium}
    - {run_order: 19, block: 10, position: 1, obstacle_profile: medium}
    - {run_order: 20, block: 10, position: 2, obstacle_profile: low}
    - {run_order: 21, block: 11, position: 1, obstacle_profile: medium}
    - {run_order: 22, block: 11, position: 2, obstacle_profile: low}
    - {run_order: 23, block: 12, position: 1, obstacle_profile: medium}
    - {run_order: 24, block: 12, position: 2, obstacle_profile: low}
    - {run_order: 25, block: 13, position: 1, obstacle_profile: medium}
    - {run_order: 26, block: 13, position: 2, obstacle_profile: low}
    - {run_order: 27, block: 14, position: 1, obstacle_profile: medium}
    - {run_order: 28, block: 14, position: 2, obstacle_profile: low}
    - {run_order: 29, block: 15, position: 1, obstacle_profile: medium}
    - {run_order: 30, block: 15, position: 2, obstacle_profile: low}

primary_outcomes:
  - task_failure_rate
  - error_code_201_rate
primary_estimand: risk_difference_medium_minus_low
analysis:
  confidence_interval: wilson_95_percent_per_group
  group_comparison: fisher_exact_two_sided
  alpha: 0.05
  report_always:
    - group_task_count
    - group_failure_count
    - group_failure_rate
    - absolute_risk_difference
    - risk_ratio_when_defined
    - confidence_intervals

mechanism_metrics:
  - early_3s_mean_abs_linear_speed_mps
  - entered_sensing_stage
  - navigation_terminal_status
  - error_code
mechanism_rule: retain_continuous_speed_value_do_not_use_posthoc_0_005_threshold_for_decisions

efficiency_metrics:
  - cycle_time_mean_sec
  - cycle_time_p50_sec
  - cycle_time_p90_sec
  - cycle_time_p95_sec

guardrails:
  - minimum_obstacle_distance_m
  - safety_stop_task_rate
  - stale_sensor_task_rate
  - valid_telemetry_coverage_rate
guardrail_rule: report_observed_values_without_inventing_an_unfrozen_distance_threshold

validity_rules:
  valid_task_requires:
    - exactly_one_action_terminal
    - structured_event_and_action_terminal_reconciled
    - required_telemetry_topics_complete
    - timestamps_valid
    - readable_rosbag
    - process_cleanup_passed
    - configured_route_obstacle_perturbation_and_parameter_match
  invalid_run_handling: quarantine_with_reason_and_repeat_same_planned_slot_using_new_batch_id
  failed_task_handling: retain_as_valid_when_all_evidence_and_quality_rules_pass

stopping_rules:
  statistical_early_stop: forbidden
  outcome_based_sample_extension: forbidden
  normal_stop: 15_valid_tasks_per_group
  operational_pause:
    - collision_or_obvious_unsafe_behavior
    - safety_chain_abnormality
    - ros_domain_or_gazebo_partition_contamination
    - navigation_lifecycle_not_ready
    - evidence_or_data_quality_gate_failure
    - experiment_process_cleanup_failure
    - three_consecutive_invalid_attempts
  resume_rule: resolve_and_record_operational_issue_then_resume_first_unfinished_planned_slot

execution_boundary:
  requires_explicit_user_authorization_after_preregistration: true
  ros_domain_id: assign_unique_at_execution
  gazebo_partition: assign_unique_at_execution
  output_root: artifacts/roa_w6/roa-validation-a1-v0.1
  no_m7_or_physical_robot: true
